name: Sync Discussion Votes

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup or checkout data-votes branch
        run: |
          git fetch origin || true
          if git ls-remote --exit-code --heads origin data-votes; then
            git checkout data-votes
          else
            git checkout --orphan data-votes
            git rm -rf . 2>/dev/null || true
            echo '[]' > votes.json
            git add votes.json
            git commit -m "chore: initialize data-votes branch"
          fi

      - name: Fetch all Feature Requests discussions dynamically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, re, os, sys

          TOKEN = os.environ["GH_TOKEN"]

          def graphql(query):
              result = subprocess.run(
                  ["curl", "-s", "-X", "POST",
                   "-H", f"Authorization: Bearer {TOKEN}",
                   "-H", "Content-Type: application/json",
                   "-d", json.dumps({"query": query}),
                   "https://api.github.com/graphql"],
                  capture_output=True, text=True
              )
              data = json.loads(result.stdout)
              if "errors" in data:
                  print("GraphQL errors:", data["errors"], file=sys.stderr)
                  sys.exit(1)
              return data

          # Step 1: get the Feature Requests category ID
          cats = graphql('{ repository(owner: "BugTraceAI", name: "BugTraceAI") { discussionCategories(first: 20) { nodes { id name } } } }')
          nodes = cats["data"]["repository"]["discussionCategories"]["nodes"]
          cat_node = next((n for n in nodes if n["name"] == "Feature Requests"), None)
          if not cat_node:
              print("Category 'Feature Requests' not found", file=sys.stderr)
              sys.exit(1)
          cat_id = cat_node["id"]

          # Step 2: get all discussions in that category with reaction counts
          query = (
              '{ repository(owner: "BugTraceAI", name: "BugTraceAI") '
              '{ discussions(first: 50, categoryId: "%s") '
              '{ nodes { number title body url '
              'reactionGroups { content reactors { totalCount } } } } } }' % cat_id
          )
          discs = graphql(query)

          def slugify(s):
              return re.sub(r"-+", "-", re.sub(r"[^a-z0-9]+", "-", s.lower())).strip("-")

          def clean_body(body):
              body = body or ""
              body = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', body)
              body = re.sub(r'[*_`#>|~^]+', '', body)
              body = re.sub(r'\s+', ' ', body).strip()
              return body[:180]

          features = []
          for d in discs["data"]["repository"]["discussions"]["nodes"]:
              votes = next(
                  (g["reactors"]["totalCount"] for g in d["reactionGroups"] if g["content"] == "THUMBS_UP"),
                  0
              )
              features.append({
                  "id": slugify(d["title"]),
                  "title": d["title"],
                  "desc": clean_body(d["body"]),
                  "url": d["url"],
                  "discussion": d["number"],
                  "votes": votes,
              })

          features.sort(key=lambda x: -x["votes"])

          with open("votes.json", "w") as f:
              json.dump(features, f, indent=2)

          print(f"Written {len(features)} features to votes.json")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config --global user.name "bugtrace-bot"
          git config --global user.email "bot@bugtraceai.com"
          git add votes.json
          git diff --cached --quiet || git commit -m "chore: sync votes from discussions [skip ci]"
          git push origin data-votes
